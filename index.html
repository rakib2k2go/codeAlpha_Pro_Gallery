<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos — Pro Gallery (Google Photos style)</title>
  <meta name="description" content="Local, drag-drop, paste, folders, search, sort, recents, and a premium viewer with slideshow/fullscreen/download. Google Photos–style masonry grid." />
  <style>
    :root{--bg:#f8f9fa;--panel:#fff;--text:#202124;--muted:#5f6368;--border:#e0e0e0;--accent:#1a73e8;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,-apple-system,Segoe UI,Arial,Helvetica,'Noto Sans',sans-serif}
    .wrap{max-width:1220px;margin:0 auto;padding:12px}
    .appbar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
      padding:10px 12px;margin-bottom:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
      border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .brand{display:flex;gap:10px;align-items:center}
    .logo{width:28px;height:28px;border-radius:6px;background:conic-gradient(from 45deg,#34a853 0 25%,#fbbc04 0 50%,#4285f4 0 75%,#ea4335 0 100%)}
    .brand h1{font-size:18px;margin:0 0 2px 0} .hint{font-size:12px;color:var(--muted)}
    .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
    .filelbl,.chip,.field,.select,.btn{height:36px;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);display:inline-flex;align-items:center;gap:8px}
    input[type=file]{display:none} .filelbl{cursor:pointer} .btn{cursor:pointer}
    .chip{cursor:pointer;color:var(--muted);font-weight:600} .chip.active{color:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
    .field{min-width:200px} .select{border-radius:999px} .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
    .dropzone{margin-top:10px;border:2px dashed var(--border);border-radius:14px;padding:14px;display:grid;place-items:center;color:var(--muted);background:#fff}
    .dropzone.drag{border-color:var(--accent);color:#1a73e8;background:#ecf3fe}

    .masonry{column-width:220px;column-gap:10px}
    @media(max-width:820px){.masonry{column-width:180px}}
    @media(max-width:520px){.masonry{column-width:150px}}

    .tile{display:inline-block;width:100%;margin:0 0 10px;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--border);
      box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:zoom-in;position:relative}
    .tile img{width:100%;height:auto;display:block}
    .tile .cap{position:absolute;left:8px;right:8px;bottom:8px;padding:6px 8px;border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45));color:#fff;font-size:12px;font-weight:600;opacity:0;transition:opacity .2s}
    .tile:hover .cap{opacity:1}

    .recents{margin-top:18px} .recents h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
    .rail{display:grid;grid-auto-flow:column;grid-auto-columns:140px;gap:10px;overflow-x:auto;padding-bottom:6px}
    .thumb{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
    .thumb img{width:140px;height:94px;object-fit:cover;display:block}

    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);z-index:1000}
    .lightbox.open{display:flex}
    .viewer{position:relative;width:min(1400px,98vw);height:92svh;display:grid;grid-template-rows:auto 1fr auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;color:#fff}
    .nav-left,.nav-right{display:flex;align-items:center;gap:8px}
    .i{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);cursor:pointer}
    .i:hover{background:rgba(255,255,255,.2)}
    .stage{position:relative;background:#000;overflow:hidden}
    .stage img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;user-select:none;touch-action:pan-y}
    .botbar{display:flex;justify-content:center;gap:10px;padding:10px}
    .count{color:#fff;opacity:.9}

    .m-bottom{display:none}
    @media(max-width:640px){
      .viewer{grid-template-rows:1fr auto}
      .topbar{display:none}
      .m-bottom{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:space-around;padding:10px;background:rgba(32,33,36,.7);backdrop-filter:blur(8px)}
      .m-bottom .i{background:rgba(255,255,255,.16);border-color:transparent}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="appbar">
      <div class="brand"><div class="logo"></div><div><h1>Photos</h1><div class="hint">Local • Masonry • Viewer</div></div></div>
      <div></div>
      <div class="controls">
        <label class="filelbl" for="fileInput">Add images<input id="fileInput" type="file" accept="image/*" multiple></label>
        <label class="filelbl" for="folderInput">Add folder<input id="folderInput" type="file" webkitdirectory directory multiple></label>
        <div class="chip active" data-filter="all">All</div>
        <div class="chip" data-filter="local">Local</div>
        <div class="chip" data-filter="recent">Recents</div>
        <input id="q" class="field" placeholder="Search">
        <select id="sort" class="select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="nameAsc">Name ↑</option>
          <option value="nameDesc">Name ↓</option>
        </select>
        <button id="clearRecents" class="btn">Clear recents</button>
      </div>
    </div>

    <div id="dropzone" class="dropzone">Drag & drop images or folders • or paste (Ctrl/Cmd+V)</div>

    <section id="gallery" class="masonry" aria-live="polite"></section>

    <section class="recents" id="recentWrap">
      <h3>Recently viewed <small id="recentCount"></small></h3>
      <div class="rail" id="recentRail"></div>
    </section>
  </div>

  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Image viewer">
    <div class="viewer">
      <div class="topbar">
        <div class="nav-left"><button class="i" id="btnBack" title="Back">↩</button></div>
        <div class="nav-right">
          <button class="i" id="btnPrev" title="Previous">◀</button>
          <button class="i" id="btnNext" title="Next">▶</button>
          <button class="i" id="btnClose" title="Close">✕</button>
        </div>
      </div>
      <div class="stage"><img id="lbImg" alt="Expanded view"></div>
      <div class="botbar">
        <button class="i" id="btnPlay" title="Slideshow">▸</button>
        <button class="i" id="btnFull" title="Fullscreen">⛶</button>
        <button class="i" id="btnDownload" title="Download">⬇</button>
        <div class="count" id="lbCount">0 / 0</div>
      </div>
    </div>
    <div class="m-bottom" hidden>
      <button class="i" id="mPrev" title="Previous">◀</button>
      <button class="i" id="mNext" title="Next">▶</button>
      <button class="i" id="mClose" title="Close">✕</button>
    </div>
  </div>

  <script>
    const $$=(s,c=document)=>Array.from(c.querySelectorAll(s));
    const $ =(s,c=document)=>c.querySelector(s);
    const humanDate=d=>new Date(d).toLocaleString();

    const gallery=$('#gallery');
    const MAX_RECENTS=24, RECENT_KEY='photos.pro.recents.v1';

    let allImages=[]; let visible=[]; let idx=0; let slideTimer=null; let scale=1,posX=0,posY=0;

    const loadRecents=()=>{ try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch{return[]} };
    const saveRecents=l=>localStorage.setItem(RECENT_KEY, JSON.stringify(l.slice(0,MAX_RECENTS)));
    function rememberView({src,name,thumb}){
      const r=loadRecents(); const key=(name||'')+'|'+(src||'');
      const f=r.filter(x=>((x.name||'')+'|'+(x.src||''))!==key);
      f.unshift({name,src:src||'',thumb:thumb||src,viewedAt:Date.now()}); saveRecents(f); renderRecents();
    }
    function renderRecents(){
      const rail=$('#recentRail'),wrap=$('#recentWrap'); const list=loadRecents();
      rail.innerHTML=''; $('#recentCount').textContent=list.length?`(${list.length})`:'';
      list.forEach((r,i)=>{ const d=document.createElement('div'); d.className='thumb'; d.innerHTML=`<img src="${r.thumb}" alt="${r.name||'Recent'}">`; d.title=`${r.name} — ${humanDate(r.viewedAt)}`; d.onclick=()=>openFromRecent(i); rail.appendChild(d); });
      wrap.style.display=list.length?'block':'none';
    }

    async function makeThumb(file, max=600){
      return new Promise((resolve,reject)=>{ const img=new Image(); const rd=new FileReader();
        rd.onload=()=>img.src=rd.result; rd.onerror=reject; img.onload=()=>{
          const ratio=img.naturalWidth/img.naturalHeight;
          const w=Math.min(max,img.naturalWidth), h=Math.round(w/ratio);
          const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',.85));
        }; rd.readAsDataURL(file); });
    }

    async function addFiles(files){
      const list=Array.from(files).filter(f=>f.type.startsWith('image/'));
      for(const f of list){
        const src=URL.createObjectURL(f);
        const title=f.webkitRelativePath? f.webkitRelativePath.split('/').slice(-2).join(' / '):(f.name||'image');
        const thumb=await makeThumb(f).catch(()=>null);
        allImages.push({src,title,ts:f.lastModified||Date.now(),thumb,category:'local'});
      }
      apply();
    }

    const drop=$('#dropzone');
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.add('drag');}));
    ;['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.remove('drag');}));
    drop.addEventListener('drop', async e=>{
      const items=e.dataTransfer?.items;
      if(items && items[0] && items[0].webkitGetAsEntry){
        const entries=Array.from(items).map(i=>i.webkitGetAsEntry()).filter(Boolean); const files=[];
        const read=(entry,p='')=>new Promise(res=>{
          if(entry.isFile){ entry.file(f=>{ f.webkitRelativePath=p+f.name; files.push(f); res(); }); }
          else if(entry.isDirectory){ const r=entry.createReader(); r.readEntries(async ents=>{ for(const en of ents){ await read(en, p+entry.name+'/'); } res(); }); }
          else res();
        });
        for(const en of entries) await read(en); await addFiles(files);
      } else { await addFiles(e.dataTransfer.files); }
    });

    window.addEventListener('paste', async e=>{ const files=[]; for(const it of e.clipboardData.items){ if(it.kind==='file') files.push(it.getAsFile()); } if(files.length) await addFiles(files); });

    $('#fileInput').addEventListener('change', e=>addFiles(e.target.files));
    $('#folderInput').addEventListener('change', e=>addFiles(e.target.files));
    $('#clearRecents').addEventListener('click', ()=>{ localStorage.removeItem(RECENT_KEY); renderRecents(); });

    let filter='all';
    $$('.chip').forEach(b=> b.addEventListener('click', ()=>{ $$('.chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); filter=b.dataset.filter; apply(); }));
    $('#q').addEventListener('input', apply);
    $('#sort').addEventListener('change', apply);

    function apply(){
      const q=$('#q').value.trim().toLowerCase();
      if(filter==='recent'){ const r=loadRecents(); visible=r.map(x=>({src:x.src||x.thumb,title:x.name||'Recent',ts:x.viewedAt,thumb:x.thumb,category:'recent'})); }
      else { visible=allImages.filter(x=> filter==='all' || x.category===filter); }
      if(q) visible=visible.filter(x=>x.title.toLowerCase().includes(q));
      const s=$('#sort').value; const byName=(a,b)=>a.title.localeCompare(b.title); const byTime=(a,b)=>(b.ts||0)-(a.ts||0);
      if(s==='nameAsc') visible.sort(byName); if(s==='nameDesc') visible.sort((a,b)=>byName(b,a)); if(s==='newest') visible.sort(byTime); if(s==='oldest') visible.sort((a,b)=>byTime(b,a));
      render();
    }

    function render(){
      gallery.innerHTML='';
      const frag=document.createDocumentFragment();
      visible.forEach((img,i)=>{
        const fig=document.createElement('figure'); fig.className='tile'; fig.dataset.idx=i;
        fig.innerHTML=`<img src="${img.thumb||img.src}" alt="${img.title}" loading="lazy"><figcaption class="cap">${img.title}</figcaption>`;
        fig.addEventListener('click', ()=>open(i)); frag.appendChild(fig);
      });
      gallery.appendChild(frag);
    }

    const lb=$('#lightbox'), lbImg=$('#lbImg'), lbCount=$('#lbCount');
    const btnPrev=$('#btnPrev'), btnNext=$('#btnNext'), btnClose=$('#btnClose'), btnBack=$('#btnBack');
    const mPrev=$('#mPrev'), mNext=$('#mNext'), mClose=$('#mClose');
    const btnPlay=$('#btnPlay'), btnFull=$('#btnFull'), btnDl=$('#btnDownload');
    const stage=document.querySelector('.stage');
    function updateLB(){ lbImg.style.transform=`translate(${posX}px,${posY}px) scale(${scale})`; lbCount.textContent=`${idx+1} / ${visible.length}`; }
    function load(){ const it=visible[idx]; lbImg.src=it.src; scale=1; posX=posY=0; updateLB(); rememberView({src: it.src.startsWith('blob:')?'':it.src, name:it.title, thumb:it.thumb||it.src}); }
    function open(i){ if(!visible.length) return; idx=(i+visible.length)%visible.length; load(); lb.classList.add('open'); document.body.style.overflow='hidden'; }
    function close(){ lb.classList.remove('open'); document.body.style.overflow=''; stopSlide(); }
    function next(){ idx=(idx+1)%visible.length; load(); }
    function prev(){ idx=(idx-1+visible.length)%visible.length; load(); }
    function openFromRecent(i){ const r=loadRecents()[i]; visible=[{src:r.src||r.thumb,title:r.name||'Recent',ts:r.viewedAt,thumb:r.thumb,category:'recent'}]; open(0); }

    [btnPrev, mPrev].forEach(b=> b.addEventListener('click', prev));
    [btnNext, mNext].forEach(b=> b.addEventListener('click', next));
    [btnClose, mClose, btnBack].forEach(b=> b.addEventListener('click', close));

    window.addEventListener('keydown', e=>{ if(!lb.classList.contains('open')) return; if(e.key==='Escape') close(); if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key===' ') { e.preventDefault(); toggleSlide(); }});
    let startX=0; lbImg.addEventListener('touchstart', e=> startX=e.touches[0].clientX, {passive:true});
    lbImg.addEventListener('touchend', e=>{ const dx=e.changedTouches[0].clientX-startX; if(Math.abs(dx)>40) (dx<0?next:prev)(); }, {passive:true});

    let lastTap=0;
    stage.addEventListener('click', e=>{ const t=Date.now(); if(t-lastTap<280){ toggleZoom(e.clientX,e.clientY); } lastTap=t; });
    function toggleZoom(cx,cy){ if(scale===1) zoomTo(2,cx,cy); else resetZoom(); }
    function resetZoom(){ scale=1; posX=posY=0; updateLB(); }
    function zoomTo(n,cx,cy){ const rect=stage.getBoundingClientRect(); const dx=cx-rect.left-rect.width/2, dy=cy-rect.top-rect.height/2; posX = posX - dx*(n-scale)/n; posY = posY - dy*(n-scale)/n; scale=Math.min(Math.max(n,1),4); updateLB(); }
    let touchStartDist=0, startPos={x:0,y:0};
    stage.addEventListener('touchstart', e=>{ if(e.touches.length===2){ touchStartDist = getDist(e.touches[0], e.touches[1]); } startPos = { x: e.touches[0].clientX - posX, y: e.touches[0].clientY - posY }; }, {passive:true});
    stage.addEventListener('touchmove', e=>{ if(e.touches.length===2){ const d = getDist(e.touches[0], e.touches[1]); const s = Math.min(Math.max(scale * (d/touchStartDist), 1), 4); scale = s; updateLB(); } else if(e.touches.length===1 && scale>1){ posX = e.touches[0].clientX - startPos.x; posY = e.touches[0].clientY - startPos.y; updateLB(); } }, {passive:true});
    function getDist(a,b){ const dx=a.clientX-b.clientX, dy=a.clientY-b.clientY; return Math.hypot(dx,dy); }

    function toggleSlide(){ slideTimer?stopSlide():startSlide(); }
    function startSlide(){ btnPlay.textContent='❚❚'; slideTimer=setInterval(next, 2500); }
    function stopSlide(){ btnPlay.textContent='▸'; clearInterval(slideTimer); slideTimer=null; }
    btnPlay.addEventListener('click', toggleSlide);
    btnFull.addEventListener('click', ()=>{ const el=document.querySelector('.viewer'); if(!document.fullscreenElement) el.requestFullscreen?.(); else document.exitFullscreen?.(); });
    btnDl.addEventListener('click', ()=>{ const a=document.createElement('a'); a.href=visible[idx].src; a.download=(visible[idx].title||'image').replace(/\s+/g,'_'); a.click(); });

    (function preload(){
      visible = ['data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAwJyBoZWlnaHQ9JzkwMCc+CiAgPGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSdnJyB4MT0nMCcgeDI9JzEnIHkxPScwJyB5Mj0nMSc+CiAgICA8c3RvcCBvZmZzZXQ9JzAlJyBzdG9wLWNvbG9yPScjNDI4NWY0Jy8+PHN0b3Agb2Zmc2V0PScxMDAlJyBzdG9wLWNvbG9yPScjZWE0MzM1Jy8+CiAgPC9saW5lYXJHcmFkaWVudD48L2RlZnM+CiAgPHJlY3Qgd2lkdGg9JzEwMCUnIGhlaWdodD0nMTAwJScgZmlsbD0ndXJsKCNnKScvPgogIDx0ZXh0IHg9JzUwJScgeT0nNTAlJyBmb250LXNpemU9JzcyJyBmb250LWZhbWlseT0nQXJpYWwsIEhlbHZldGljYSwgc2Fucy1zZXJpZicgZmlsbD0nd2hpdGUnIHRleHQtYW5jaG9yPSdtaWRkbGUnIGRvbWluYW50LWJhc2VsaW5lPSdtaWRkbGUnPlNhbXBsZSAxPC90ZXh0Pgo8L3N2Zz4=', 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAwJyBoZWlnaHQ9JzkwMCc+CiAgPGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSdnJyB4MT0nMCcgeDI9JzEnIHkxPScwJyB5Mj0nMSc+CiAgICA8c3RvcCBvZmZzZXQ9JzAlJyBzdG9wLWNvbG9yPScjMzRhODUzJy8+PHN0b3Agb2Zmc2V0PScxMDAlJyBzdG9wLWNvbG9yPScjZmJiYzA0Jy8+CiAgPC9saW5lYXJHcmFkaWVudD48L2RlZnM+CiAgPHJlY3Qgd2lkdGg9JzEwMCUnIGhlaWdodD0nMTAwJScgZmlsbD0ndXJsKCNnKScvPgogIDx0ZXh0IHg9JzUwJScgeT0nNTAlJyBmb250LXNpemU9JzcyJyBmb250LWZhbWlseT0nQXJpYWwsIEhlbHZldGljYSwgc2Fucy1zZXJpZicgZmlsbD0nd2hpdGUnIHRleHQtYW5jaG9yPSdtaWRkbGUnIGRvbWluYW50LWJhc2VsaW5lPSdtaWRkbGUnPlNhbXBsZSAyPC90ZXh0Pgo8L3N2Zz4=', 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAwJyBoZWlnaHQ9JzkwMCc+CiAgPGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSdnJyB4MT0nMCcgeDI9JzEnIHkxPScwJyB5Mj0nMSc+CiAgICA8c3RvcCBvZmZzZXQ9JzAlJyBzdG9wLWNvbG9yPScjNjczYWI3Jy8+PHN0b3Agb2Zmc2V0PScxMDAlJyBzdG9wLWNvbG9yPScjMDNhOWY0Jy8+CiAgPC9saW5lYXJHcmFkaWVudD48L2RlZnM+CiAgPHJlY3Qgd2lkdGg9JzEwMCUnIGhlaWdodD0nMTAwJScgZmlsbD0ndXJsKCNnKScvPgogIDx0ZXh0IHg9JzUwJScgeT0nNTAlJyBmb250LXNpemU9JzcyJyBmb250LWZhbWlseT0nQXJpYWwsIEhlbHZldGljYSwgc2Fucy1zZXJpZicgZmlsbD0nd2hpdGUnIHRleHQtYW5jaG9yPSdtaWRkbGUnIGRvbWluYW50LWJhc2VsaW5lPSdtaWRkbGUnPlNhbXBsZSAzPC90ZXh0Pgo8L3N2Zz4=', 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy       render();
    })();

    renderRecents();
  </script>
</body>
</html>
